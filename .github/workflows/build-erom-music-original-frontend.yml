name: Build Erom Música Original Frontend APK

on:
  push:
    paths:
      - ".github/workflows/build-erom-music-original-frontend.yml"
  workflow_dispatch:
    inputs:
      pagina_inicial:
        description: "HTML inicial dentro do ZIP (deixe vazio para detectar index.html/home.html)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Empacotar frontend original sem alterações
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair frontend original sem modificar arquivos
        shell: bash
        env:
          PAGE_INPUT: ${{ inputs.pagina_inicial }}
        run: |
          set -euo pipefail
          ZIP="Erom-Music-Frontend-Original-Cloudflare.zip"
          test -s "$ZIP" || { echo "::error::Arquivo original não encontrado: $ZIP"; exit 1; }
          mkdir -p source
          unzip -q "$ZIP" -d source
          if [ -n "${PAGE_INPUT:-}" ]; then
            ENTRY="$(find source -type f -path "*/$PAGE_INPUT" -print -quit)"
          else
            ENTRY="$(find source -type f \( -iname 'index.html' -o -iname 'home.html' \) -print -quit)"
          fi
          test -n "$ENTRY" && test -s "$ENTRY" || { echo "::error::HTML inicial não encontrado. Preencha pagina_inicial no Run workflow."; find source -maxdepth 5 -type f | head -100; exit 1; }
          REL="${ENTRY#source/}"
          mkdir -p android/app/src/main/assets/site
          cp -R source/. android/app/src/main/assets/site/
          echo "ENTRY_REL=$REL" >> "$GITHUB_ENV"
          echo "Frontend original copiado sem alterações: $REL"
          sha256sum "$ENTRY"

      - name: Preparar projeto Android WebView
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/br/com/erommusic/original android/app/src/main/res/values
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EromMusicOriginal"
          include(":app")
          EOF
          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          echo "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" > android/gradle.properties
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'br.com.erommusic.original'
              compileSdk 35
              defaultConfig {
                  applicationId 'br.com.erommusic.original'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0.0'
              }
              buildTypes { debug { buildConfigField 'String', 'ENTRY_PATH', '"' + System.getenv('ENTRY_REL') + '"' } }
              buildFeatures { buildConfig true }
          }
          EOF
          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Erom Música</string></resources>
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="@string/app_name" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
              <activity android:name="br.com.erommusic.original.MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/br/com/erommusic/original/MainActivity.java <<'EOF'
          package br.com.erommusic.original;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.net.Uri;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          public class MainActivity extends Activity {
            private WebView webView;
            private void immersiveMode() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN |
                View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
            }
            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              immersiveMode();
              webView = new WebView(this);
              webView.setBackgroundColor(0xFF101010);
              setContentView(webView);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
              webView.setWebViewClient(new WebViewClient() {
                private boolean openExternal(Uri uri) {
                  String scheme = uri.getScheme();
                  if ("https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme) ||
                      "file".equalsIgnoreCase(scheme) || "about".equalsIgnoreCase(scheme) ||
                      "data".equalsIgnoreCase(scheme) || "javascript".equalsIgnoreCase(scheme)) return false;
                  try {
                    startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (ActivityNotFoundException ignored) { }
                  return true;
                }
                @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                  return openExternal(request.getUrl());
                }
                @SuppressWarnings("deprecation")
                @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {
                  return openExternal(Uri.parse(url));
                }
              });
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl("file:///android_asset/site/" + BuildConfig.ENTRY_PATH);
            }
            @Override public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) immersiveMode();
            }
            @Override public void onBackPressed() {
              if (webView != null && webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
          }
          EOF

      - name: Compilar APK do frontend original
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace -p android assembleDebug
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          mkdir -p output
          cp "$APK" output/Erom-Music-Frontend-Original.apk
          sha256sum output/Erom-Music-Frontend-Original.apk
          ls -lh output/Erom-Music-Frontend-Original.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Erom-Music-Frontend-Original-APK
          path: output/Erom-Music-Frontend-Original.apk
          if-no-files-found: error
          retention-days: 14
