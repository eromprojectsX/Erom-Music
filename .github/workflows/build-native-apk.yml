name: Build EROM BOX Native Offline APK
on:
  workflow_dispatch:
  push:
    paths:
      - "erom-box/native-src/**"
      - ".github/workflows/build-native-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate native Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-build/app/src/main/java/br/com/erombox/nativeapp native-build/app/src/main/res/values
          cp erom-box/native-src/MainActivity.java native-build/app/src/main/java/br/com/erombox/nativeapp/MainActivity.java
          cat > native-build/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EROMBOXNative"
          include(":app")
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > native-build/build.gradle
          echo "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" > native-build/gradle.properties
          cat > native-build/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'br.com.erombox.nativeapp'
              compileSdk 35
              defaultConfig { applicationId 'br.com.erombox.nativeapp'; minSdk 23; targetSdk 28; versionCode 1; versionName '1.0' }
          }
          EOF
          cat > native-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">EROM BOX</string></resources>
          EOF
          cat > native-build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@android:style/Theme.Material.NoActionBar" android:label="@string/app_name" android:allowBackup="true">
              <activity android:name="br.com.erombox.nativeapp.MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile standalone native APK
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace -p native-build assembleDebug
          APK=native-build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          mkdir -p output
          cp "$APK" output/EROM-BOX-NATIVO-OFFLINE.apk
          sha256sum output/EROM-BOX-NATIVO-OFFLINE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EROM-BOX-NATIVO-OFFLINE
          path: output/EROM-BOX-NATIVO-OFFLINE.apk
          retention-days: 14
