name: Build Erom Music APK corrigido
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-erom-music-corrigido.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Montar projeto Android preservando a interface original
        shell: bash
        run: |
          set -euo pipefail
          test -f "Erom-Music-Frontend-Original-Cloudflare.zip"
          mkdir -p app/src/main/assets app/src/main/java/br/com/erommusic/app
          mkdir -p /tmp/erom-frontend
          unzip -q "Erom-Music-Frontend-Original-Cloudflare.zip" -d /tmp/erom-frontend
          HTML="$(find /tmp/erom-frontend -type f -iname 'index.html' -size +100k | head -n 1)"
          if [ -z "$HTML" ]; then
            HTML="$(find /tmp/erom-frontend -type f -iname '*.html' -size +100k | head -n 1)"
          fi
          test -n "$HTML"
          cp "$HTML" app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'EromMusicAndroid'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'br.com.erommusic.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'br.com.erommusic.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.0.1'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <application android:allowBackup="false" android:usesCleartextTraffic="false" android:label="Erom Music" android:theme="@android:style/Theme.Material.NoActionBar" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/br/com/erommusic/app/MainActivity.java <<'EOF'
          package br.com.erommusic.app;
          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentUris;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONArray;
          import org.json.JSONObject;
          public class MainActivity extends Activity {
              private WebView webView;
              private static final int AUDIO_PERMISSION_REQUEST = 2302;
              private String audioPermission() { return Build.VERSION.SDK_INT >= 33 ? Manifest.permission.READ_MEDIA_AUDIO : Manifest.permission.READ_EXTERNAL_STORAGE; }
              private boolean hasAudioPermission() { return Build.VERSION.SDK_INT < 23 || checkSelfPermission(audioPermission()) == PackageManager.PERMISSION_GRANTED; }
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(android.graphics.Color.BLACK);
                  getWindow().setNavigationBarColor(android.graphics.Color.BLACK);
                  webView = new WebView(this);
                  webView.setBackgroundColor(android.graphics.Color.BLACK);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setMediaPlaybackRequiresUserGesture(false);
                  webView.addJavascriptInterface(new DeviceAudioBridge(), "EromAndroid");
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView view, String url) {
                          view.evaluateJavascript("(" + injectedLibraryScript() + ")();", null);
                      }
                  });
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
                  if (Build.VERSION.SDK_INT >= 23 && !hasAudioPermission()) requestPermissions(new String[]{audioPermission()}, AUDIO_PERMISSION_REQUEST);
              }
              private String injectedLibraryScript() {
                  return "function(){window.alert=function(){return;};function hideEromBoxNotice(){var all=document.querySelectorAll('body *');for(var i=0;i<all.length;i++){var el=all[i];if(el.children.length===0&&/Selecione a pasta EromBox\\. Somente músicas dentro dela serão\\s*importadas\\./i.test(el.textContent||'')){el.style.display='none';el.setAttribute('aria-hidden','true');}}}hideEromBoxNotice();new MutationObserver(hideEromBoxNotice).observe(document.documentElement,{childList:true,subtree:true,characterData:true});var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);while(walker.nextNode()){var node=walker.currentNode;node.nodeValue=node.nodeValue.replace(/Selecione a pasta EromBox\\. Somente músicas dentro dela serão\\s*importadas\\./gi,'As músicas do armazenamento interno serão encontradas automaticamente, exceto arquivos do WhatsApp e áudios do Yahoo.').replace(/Selecione a pasta onde estão suas músicas baixadas/gi,'Encontre músicas em todo o armazenamento interno, exceto pastas do WhatsApp e áudios do Yahoo');}if(typeof window.refreshDeviceAudio==='function'){window.refreshDeviceAudio();return;}if(document.getElementById('erom-internal-tab'))return;var style=document.createElement('style');style.textContent='#erom-internal-tab{position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483646;border:1px solid #333;border-radius:16px;background:#171717;color:#fff;padding:13px 16px;font:600 14px sans-serif;box-shadow:0 4px 20px #0008}#erom-internal-panel{position:fixed;inset:5% 4% 78px;z-index:2147483647;background:#101010;color:#fff;border:1px solid #444;border-radius:18px;padding:16px;overflow:auto;font:14px sans-serif;box-shadow:0 0 0 9999px #0009}#erom-internal-panel input{box-sizing:border-box;width:100%;padding:11px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:10px 0}#erom-internal-panel .erom-track{padding:12px 2px;border-bottom:1px solid #333;display:flex;gap:12px;align-items:center}#erom-internal-panel .erom-track-info{flex:1;min-width:0;overflow-wrap:anywhere}#erom-internal-panel button{border-radius:10px;padding:8px 12px}';document.head.appendChild(style);var tab=document.createElement('button');tab.id='erom-internal-tab';tab.textContent='♫  Armazenamento interno · músicas do celular';document.body.appendChild(tab);tab.onclick=function(){var old=document.getElementById('erom-internal-panel');if(old){old.remove();return;}if(!window.EromAndroid.hasAudioPermission()){window.EromAndroid.requestAudioPermission();return;}var files=[];try{files=JSON.parse(window.EromAndroid.getAudioFiles()||'[]')}catch(e){}var p=document.createElement('section');p.id='erom-internal-panel';var h=document.createElement('div');h.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:8px';var title=document.createElement('b');title.textContent='Armazenamento interno';var close=document.createElement('button');close.textContent='Fechar';close.onclick=function(){p.remove()};h.append(title,close);p.appendChild(h);var desc=document.createElement('p');desc.textContent=files.length+' músicas encontradas no dispositivo';desc.style.color='#aaa';p.appendChild(desc);var search=document.createElement('input');search.placeholder='Buscar música ou artista';search.setAttribute('aria-label','Buscar música ou artista');p.appendChild(search);var list=document.createElement('div');p.appendChild(list);var audio=document.createElement('audio');audio.controls=true;audio.style.cssText='width:100%;position:sticky;bottom:0;background:#111;margin-top:12px';p.appendChild(audio);function render(){list.replaceChildren();var q=search.value.toLocaleLowerCase();var filtered=files.filter(function(f){return ((f.title||f.name||'')+' '+(f.artist||'')).toLocaleLowerCase().includes(q)});if(!filtered.length){var empty=document.createElement('p');empty.textContent='Nenhuma música encontrada para esta busca.';list.appendChild(empty)}filtered.forEach(function(f){var row=document.createElement('div');row.className='erom-track';var info=document.createElement('div');info.className='erom-track-info';var name=document.createElement('div');name.textContent=f.title||f.name||'Áudio';name.style.fontWeight='600';var artist=document.createElement('div');artist.textContent=(f.artist&&f.artist!=='<unknown>'?f.artist:'Artista desconhecido')+' · '+(f.album&&f.album!=='<unknown>'?f.album:'Armazenamento interno');artist.style.cssText='color:#aaa;font-size:12px;margin-top:4px';info.append(name,artist);var play=document.createElement('button');play.textContent='▶';play.setAttribute('aria-label','Reproduzir '+(f.title||f.name||'música'));play.onclick=function(){audio.src=f.uri;audio.play().catch(function(){})};row.append(info,play);list.appendChild(row)})}search.addEventListener('input',render);render();document.body.appendChild(p)};}";
              }
          private class DeviceAudioBridge {
                  @JavascriptInterface public boolean hasAudioPermission() { return MainActivity.this.hasAudioPermission(); }
                  @JavascriptInterface public void requestAudioPermission() { runOnUiThread(() -> { if (Build.VERSION.SDK_INT >= 23 && !MainActivity.this.hasAudioPermission()) requestPermissions(new String[]{audioPermission()}, AUDIO_PERMISSION_REQUEST); }); }
                  @JavascriptInterface public String getAudioFiles() {
                      JSONArray out = new JSONArray();
                      if (!hasAudioPermission()) return out.toString();
                      String[] projection = Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q
                          ? new String[]{MediaStore.Audio.Media._ID,MediaStore.Audio.Media.TITLE,MediaStore.Audio.Media.ARTIST,MediaStore.Audio.Media.ALBUM,MediaStore.Audio.Media.DURATION,MediaStore.Audio.Media.RELATIVE_PATH,MediaStore.Audio.Media.DISPLAY_NAME}
                          : new String[]{MediaStore.Audio.Media._ID,MediaStore.Audio.Media.TITLE,MediaStore.Audio.Media.ARTIST,MediaStore.Audio.Media.ALBUM,MediaStore.Audio.Media.DURATION,MediaStore.Audio.Media.DISPLAY_NAME,MediaStore.Audio.Media.DATA};
                      try (Cursor c = getContentResolver().query(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,projection,null,null,MediaStore.Audio.Media.TITLE+" COLLATE NOCASE ASC")) {
                          if (c != null) while(c.moveToNext()) {
                              long id=c.getLong(c.getColumnIndexOrThrow(MediaStore.Audio.Media._ID));
                              String path=Build.VERSION.SDK_INT>=Build.VERSION_CODES.Q?c.getString(c.getColumnIndexOrThrow(MediaStore.Audio.Media.RELATIVE_PATH)):c.getString(c.getColumnIndexOrThrow(MediaStore.Audio.Media.DATA));
                              String name=c.getString(c.getColumnIndexOrThrow(MediaStore.Audio.Media.DISPLAY_NAME));
                              String normalizedPathAndName = ((path==null?"":path)+"/"+(name==null?"":name)).toLowerCase(java.util.Locale.ROOT);
                              if (normalizedPathAndName.contains("whatsapp") || normalizedPathAndName.contains("yahoo")) continue;
                              JSONObject o=new JSONObject(); o.put("id",String.valueOf(id)); o.put("title",c.getString(c.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)));
                              o.put("artist",c.getString(c.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST))); o.put("album",c.getString(c.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)));
                              o.put("duration",c.getLong(c.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION))/1000); o.put("path",path); o.put("name",name);
                              o.put("uri",ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,id).toString()); out.put(o);
                          }
                      } catch(Exception ignored) {}
                      return out.toString();
                  }
              }
              @Override public void onRequestPermissionsResult(int requestCode,String[] permissions,int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode,permissions,grantResults);
                  if(requestCode==AUDIO_PERMISSION_REQUEST && webView!=null) webView.postDelayed(()->webView.evaluateJavascript("(" + injectedLibraryScript() + ")();",null),300);
              }
              @Override public void onBackPressed() { if(webView!=null&&webView.canGoBack())webView.goBack();else super.onBackPressed(); }
              @Override protected void onDestroy() { if(webView!=null){webView.destroy();webView=null;}super.onDestroy(); }
          }
          EOF
      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi
          /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace assembleDebug
      - name: Validar APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Erom-Music-Android-APK-CORRIGIDO
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
