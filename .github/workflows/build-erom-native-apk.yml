name: Build Erom Music Native APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, build-native-apk ]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-erom-native-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Erom-Music-Native-APK
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error