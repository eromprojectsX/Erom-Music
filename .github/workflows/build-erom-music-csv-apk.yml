name: Build Erom Música APK com importador CSV

on:
  push:
    paths:
      - "modelo-playlist.csv"
      - "importar-playlist.html"
      - ".github/workflows/build-erom-music-csv-apk.yml"
  workflow_dispatch:
    inputs:
      pagina_inicial:
        description: "HTML inicial dentro do ZIP (opcional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair frontend e adicionar acesso ao importador
        shell: bash
        env:
          PAGE_INPUT: ${{ inputs.pagina_inicial }}
        run: |
          set -euo pipefail
          unzip -q Erom-Music-Frontend-Original-Cloudflare.zip -d source
          if [ -n "${PAGE_INPUT:-}" ]; then
            ENTRY="$(find source -type f -path "*/$PAGE_INPUT" -print -quit)"
          else
            ENTRY="$(find source -type f \( -iname index.html -o -iname home.html \) -print -quit)"
          fi
          test -n "$ENTRY" && test -s "$ENTRY" || { echo "::error::HTML inicial não encontrado"; exit 1; }
          REL="${ENTRY#source/}"
          mkdir -p android/app/src/main/assets/site
          cp -R source/. android/app/src/main/assets/site/
          cp importar-playlist.html android/app/src/main/assets/site/importar-playlist.html
          export TARGET="android/app/src/main/assets/site/$REL"
          python3 - <<'PY'
          import os
          p=os.environ["TARGET"]
          with open(p,"r",encoding="utf-8") as f: html=f.read()
          addition = """
          <script id="erom-csv-import-entry">
          (()=>{if(document.getElementById('erom-csv-import-button'))return;
          const b=document.createElement('button');b.id='erom-csv-import-button';b.type='button';
          b.textContent='Importar playlist CSV';
          Object.assign(b.style,{position:'fixed',right:'14px',bottom:'14px',zIndex:'2147483647',padding:'12px 16px',border:'0',borderRadius:'999px',background:'#1ed760',color:'#071b0d',font:'bold 14px system-ui',boxShadow:'0 3px 16px #0008'});
          b.addEventListener('click',()=>{location.href='file:///android_asset/site/importar-playlist.html'});
          document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(b));
          if(document.readyState!=='loading')document.body.appendChild(b);
          })();
          </script>
          """
          if "</body>" in html.lower():
            i=html.lower().rfind("</body>")
            html=html[:i]+addition+html[i:]
          else: html += addition
          with open(p,"w",encoding="utf-8") as f: f.write(html)
          print("Importador ligado à página inicial:",p)
          PY
          echo "ENTRY_REL=$REL" >> "$GITHUB_ENV"

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/br/com/erommusic/original android/app/src/main/res/values
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EromMusicCSV"
          include(":app")
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > android/build.gradle
          echo "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" > android/gradle.properties
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'br.com.erommusic.original'
            compileSdk 35
            defaultConfig { applicationId 'br.com.erommusic.original'; minSdk 23; targetSdk 28; versionCode 2; versionName '1.1.0' }
            buildTypes { debug { buildConfigField 'String', 'ENTRY_PATH', '"' + System.getenv('ENTRY_REL') + '"' } }
            buildFeatures { buildConfig true }
          }
          EOF
          echo '<resources><string name="app_name">Erom Música</string></resources>' > android/app/src/main/res/values/strings.xml
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="@string/app_name" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
              <activity android:name="br.com.erommusic.original.MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/br/com/erommusic/original/MainActivity.java <<'EOF'
          package br.com.erommusic.original;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.*;
          import android.net.Uri;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> fileCallback;
            private static final int FILE_PICKER=701;
            private void immersiveMode(){getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE);}
            @Override protected void onCreate(Bundle b){super.onCreate(b);immersiveMode();webView=new WebView(this);webView.setBackgroundColor(0xFF101010);setContentView(webView);
              WebSettings s=webView.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setMediaPlaybackRequiresUserGesture(false);s.setAllowFileAccess(true);s.setAllowContentAccess(true);s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
              webView.setWebViewClient(new WebViewClient(){
                private boolean external(Uri u){String x=u.getScheme();if("https".equalsIgnoreCase(x)||"http".equalsIgnoreCase(x)||"file".equalsIgnoreCase(x)||"about".equalsIgnoreCase(x)||"data".equalsIgnoreCase(x)||"javascript".equalsIgnoreCase(x))return false;try{startActivity(new Intent(Intent.ACTION_VIEW,u));}catch(ActivityNotFoundException ignored){}return true;}
                @Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){return external(r.getUrl());}
                @SuppressWarnings("deprecation") @Override public boolean shouldOverrideUrlLoading(WebView v,String u){return external(Uri.parse(u));}
              });
              webView.setWebChromeClient(new WebChromeClient(){
                @Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> callback,FileChooserParams params){
                  if(fileCallback!=null)fileCallback.onReceiveValue(null);fileCallback=callback;
                  try{startActivityForResult(params.createIntent(),FILE_PICKER);return true;}catch(ActivityNotFoundException e){fileCallback=null;return false;}
                }
              });
              webView.loadUrl("file:///android_asset/site/"+BuildConfig.ENTRY_PATH);
            }
            @Override protected void onActivityResult(int request,int result,Intent data){super.onActivityResult(request,result,data);if(request==FILE_PICKER&&fileCallback!=null){Uri[] results=WebChromeClient.FileChooserParams.parseResult(result,data);fileCallback.onReceiveValue(results);fileCallback=null;}}
            @Override public void onWindowFocusChanged(boolean f){super.onWindowFocusChanged(f);if(f)immersiveMode();}
            @Override public void onBackPressed(){if(webView!=null&&webView.canGoBack())webView.goBack();else super.onBackPressed();}
          }
          EOF

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace -p android assembleDebug
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          mkdir -p output
          cp "$APK" output/Erom-Music-CSV-APK.apk
          sha256sum output/Erom-Music-CSV-APK.apk
          ls -lh output/Erom-Music-CSV-APK.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Erom-Music-CSV-APK
          path: output/Erom-Music-CSV-APK.apk
          if-no-files-found: error
          retention-days: 14
