name: Build Erom Música APK com importador CSV

on:
  push:
    paths:
      - "modelo-playlist.csv"
      - "importar-playlist.html"
      - ".github/workflows/build-erom-music-csv-apk.yml"
  workflow_dispatch:
    inputs:
      pagina_inicial:
        description: "HTML inicial dentro do ZIP (opcional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair frontend e adicionar acesso ao importador
        shell: bash
        env:
          PAGE_INPUT: ${{ inputs.pagina_inicial }}
        run: |
          set -euo pipefail
          unzip -q Erom-Music-Frontend-Original-Cloudflare.zip -d source
          if [ -n "${PAGE_INPUT:-}" ]; then
            ENTRY="$(find source -type f -path "*/$PAGE_INPUT" -print -quit)"
          else
            ENTRY="$(find source -type f \( -iname index.html -o -iname home.html \) -print -quit)"
          fi
          test -n "$ENTRY" && test -s "$ENTRY" || { echo "::error::HTML inicial não encontrado"; exit 1; }
          REL="${ENTRY#source/}"
          mkdir -p android/app/src/main/assets/site
          cp -R source/. android/app/src/main/assets/site/
          cp importar-playlist.html android/app/src/main/assets/site/importar-playlist.html
          export TARGET="android/app/src/main/assets/site/$REL"
          python3 - <<'PY'
          import os
          p=os.environ["TARGET"]
          with open(p,"r",encoding="utf-8") as f: html=f.read()
          addition = """
          <style id="erom-custom-theme-style">
          :root{--erom-accent:#1ed760;--erom-bg:#101010;--erom-text:#ffffff}
          #erom-settings-tools{margin:16px 0;padding:16px;border:1px solid color-mix(in srgb,var(--erom-accent) 55%,transparent);border-radius:16px;background:rgba(20,20,20,.96);color:var(--erom-text);font:14px system-ui}
          #erom-settings-tools button{border:0;border-radius:10px;padding:10px 12px;background:var(--erom-accent);color:#111;font-weight:700;margin:4px;cursor:pointer}
          #erom-settings-tools .erom-colors{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
          #erom-settings-tools label{display:inline-flex;align-items:center;gap:8px;margin:6px 10px 6px 0}
          #erom-settings-tools input[type=color]{width:42px;height:36px;border:0;background:transparent;padding:0}
          </style>
          <script id="erom-settings-tools-script">
          (()=>{if(window.__eromSettingsToolsLoaded)return;window.__eromSettingsToolsLoaded=true;
          const palettes=[['Verde Spotify','#1ed760','#101010','#ffffff'],['Azul oceano','#3b82f6','#0b1220','#f8fafc'],['Roxo neon','#a855f7','#100b18','#ffffff'],['Rosa','#f472b6','#1b1017','#fff7fb'],['Laranja','#fb923c','#1b120b','#fffaf5'],['Vermelho','#ef4444','#190b0b','#fffafa'],['Ciano','#22d3ee','#07171a','#ecfeff'],['Dourado','#eab308','#171306','#fffbea'],['Branco minimalista','#e5e7eb','#f8fafc','#111827'],['Preto e vermelho','#ff3b3b','#050505','#ffffff']];
          function applyTheme(a,b,c){document.documentElement.style.setProperty('--erom-accent',a);document.document.documentElement.style.setProperty('--erom-bg',b);document.documentElement.style.setProperty('--erom-text',c);
          let style=document.getElementById('erom-theme-overrides');if(!style){style=document.createElement('style');style.id='erom-theme-overrides';document.head.appendChild(style)}
          style.textContent=':root{--erom-accent:'+a+';--erom-bg:'+b+';--erom-text:'+c+'} body{background-color:'+b+'!important;color:'+c+'!important;--erom-accent:'+a+';--erom-bg:'+b+';--erom-text:'+c+'} button:not(#erom-settings-tools button),[role=button],.active,.selected{accent-color:'+a+'} .active,.selected,[aria-selected=true]{border-color:'+a+'!important}';
          try{localStorage.setItem('erom-custom-colors',JSON.stringify({a,b,c}))}catch(e){}}
          try{const saved=JSON.parse(localStorage.getItem('erom-custom-colors')||'null');if(saved)applyTheme(saved.a,saved.b,saved.c)}catch(e){}
          function isSettingsText(el){const t=(el.innerText||el.textContent||'').trim().toLowerCase();return t.length<45&&/(configuraç|configurac|settings|ajustes)/i.test(t)}
          function findSettingsHost(){const els=[...document.querySelectorAll('button,a,[role=button],nav li,[role=tab],h1,h2,h3,span,div')];return els.find(el=>isSettingsText(el)&&el.children.length<4)}
          function makePanel(host){if(document.getElementById('erom-settings-tools'))return;
          const panel=document.createElement('section');panel.id='erom-settings-tools';
          panel.innerHTML='<strong style="font-size:17px">Personalização do Erom Música</strong><p>Importe uma playlist ou escolha suas próprias cores.</p><button id="erom-open-csv" type="button">Importar playlist CSV</button><div style="margin-top:12px;font-weight:700">Temas prontos</div><div class="erom-colors" id="erom-palette-list"></div><div style="font-weight:700">Cores personalizadas</div><label>Cor principal <input id="erom-color-accent" type="color" value="#1ed760"></label><label>Fundo <input id="erom-color-bg" type="color" value="#101010"></label><label>Texto <input id="erom-color-text" type="color" value="#ffffff"></label><button id="erom-save-colors" type="button">Aplicar cores</button>';
          const place=host&&(host.closest('section,[role=tabpanel],main,dialog,.settings,.configuracoes')||host.parentElement);
          (place||document.querySelector('main')||document.body).appendChild(panel);
          document.getElementById('erom-open-csv').onclick=()=>{location.href='https://appassets.androidplatform.net/assets/site/importar-playlist.html'};
          const list=document.getElementById('erom-palette-list');
          palettes.forEach(p=>{const btn=document.createElement('button');btn.type='button';btn.textContent=p[0];btn.style.background=p[1];btn.style.color=p[2]==='#f8fafc'?'#111':'#fff';btn.onclick=()=>{applyTheme(p[1],p[2],p[3]);document.getElementById('erom-color-accent').value=p[1];document.getElementById('erom-color-bg').value=p[2];document.getElementById('erom-color-text').value=p[3]};list.appendChild(btn)});
          document.getElementById('erom-save-colors').onclick=()=>applyTheme(document.getElementById('erom-color-accent').value,document.getElementById('erom-color-bg').value,document.getElementById('erom-color-text').value);
          }
          function scan(){const host=findSettingsHost();if(host){const parent=host.closest('section,[role=tabpanel],main,dialog,.settings,.configuracoes')||host.parentElement;
          if(parent&&!parent.contains(document.getElementById('erom-settings-tools'))){const observer=new MutationObserver(()=>{if(!document.getElementById('erom-settings-tools')&&isSettingsText(host))makePanel(host)});observer.observe(document.body,{childList:true,subtree:true});}
          host.addEventListener('click',()=>setTimeout(()=>makePanel(host),150),{once:false});
          if(/configuraç|configurac|settings|ajustes/i.test(location.href))makePanel(host);
          }}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',scan);else scan();
          new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          """
          if "</body>" in html.lower():
            i=html.lower().rfind("</body>")
            html=html[:i]+addition+html[i:]
          else: html += addition
          with open(p,"w",encoding="utf-8") as f: f.write(html)
          print("Importador ligado à página inicial:",p)
          PY
          echo "ENTRY_REL=$REL" >> "$GITHUB_ENV"

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/br/com/erommusic/original android/app/src/main/res/values
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EromMusicCSV"
          include(":app")
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > android/build.gradle
          printf "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n" > android/gradle.properties
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'br.com.erommusic.original'
            compileSdk 35
            defaultConfig { applicationId 'br.com.erommusic.original'; minSdk 23; targetSdk 28; versionCode 2; versionName '1.1.0' }
            buildTypes { debug { buildConfigField 'String', 'ENTRY_PATH', '"' + System.getenv('ENTRY_REL') + '"' } }
            buildFeatures { buildConfig true }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.12.1'; implementation 'androidx.documentfile:documentfile:1.0.1' }
          EOF
          echo '<resources><string name="app_name">Erom Música</string></resources>' > android/app/src/main/res/values/strings.xml
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">\n            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="@string/app_name" android:usesCleartextTraffic="true" android:hardwareAccelerated="true" android:requestLegacyExternalStorage="true">
              <activity android:name="br.com.erommusic.original.MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/br/com/erommusic/original/MainActivity.java <<'EOF'
          package br.com.erommusic.original;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.*;
          import android.net.Uri;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          import android.content.ContentResolver;
          import android.database.Cursor;
          import android.provider.DocumentsContract;
          import android.util.Base64;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.documentfile.provider.DocumentFile;
          import java.io.*;
          import java.util.Locale;
          public class MainActivity extends Activity {
            private WebView webView;
            private WebViewAssetLoader assetLoader;
            private static final int PICK_MUSIC_FOLDER=702;
            private static final String[] AUDIO_EXT={".mp3",".m4a",".aac",".ogg",".wav",".flac",".opus",".wma"};
            private void immersiveMode(){getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE);}
            @Override protected void onCreate(Bundle b){super.onCreate(b);if(android.os.Build.VERSION.SDK_INT>=23&&checkSelfPermission(android.Manifest.permission.WRITE_EXTERNAL_STORAGE)!=android.content.pm.PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{android.Manifest.permission.WRITE_EXTERNAL_STORAGE},703);immersiveMode();webView=new WebView(this);webView.setBackgroundColor(0xFF101010);setContentView(webView);
              assetLoader=new WebViewAssetLoader.Builder().addPathHandler("/assets/",new WebViewAssetLoader.AssetsPathHandler(this)).build();
              WebSettings s=webView.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setMediaPlaybackRequiresUserGesture(false);s.setAllowFileAccess(true);s.setAllowContentAccess(true);s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
              webView.addJavascriptInterface(new Object(){
                @JavascriptInterface public String saveBase64(String name,String encoded){try{byte[] data=Base64.decode(encoded,Base64.DEFAULT);File dir=outputDir();if(!dir.exists()&&!dir.mkdirs())return "ERRO:Não foi possível criar a pasta Music/Erom playlist";String safe=safeName(name);File out=uniqueFile(dir,safe);try(FileOutputStream fos=new FileOutputStream(out)){fos.write(data);}return out.getAbsolutePath();}catch(Exception e){return "ERRO:"+(e.getMessage()==null?"falha ao gravar arquivo":e.getMessage());}}
                @JavascriptInterface public void chooseMusicFolder(){runOnUiThread(()->{try{Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_GRANT_WRITE_URI_PERMISSION|Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);startActivityForResult(i,PICK_MUSIC_FOLDER);}catch(ActivityNotFoundException e){notifyFolder("O seletor de pastas não está disponível neste dispositivo.");}});}
              },"EromNative");
              webView.setWebViewClient(new WebViewClient(){@Override public WebResourceResponse shouldInterceptRequest(WebView v,WebResourceRequest r){return assetLoader.shouldInterceptRequest(r.getUrl());}@SuppressWarnings("deprecation") @Override public WebResourceResponse shouldInterceptRequest(WebView v,String u){return assetLoader.shouldInterceptRequest(Uri.parse(u));}
                private boolean external(Uri u){String x=u.getScheme();if("https".equalsIgnoreCase(x)||"http".equalsIgnoreCase(x)||"file".equalsIgnoreCase(x)||"about".equalsIgnoreCase(x)||"data".equalsIgnoreCase(x)||"javascript".equalsIgnoreCase(x))return false;try{startActivity(new Intent(Intent.ACTION_VIEW,u));}catch(ActivityNotFoundException ignored){}return true;}
                @Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){return external(r.getUrl());}@SuppressWarnings("deprecation") @Override public boolean shouldOverrideUrlLoading(WebView v,String u){return external(Uri.parse(u));}});
              webView.setWebChromeClient(new WebChromeClient(){@Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> cb,FileChooserParams p){try{startActivityForResult(p.createIntent(),701);fileCallback=cb;return true;}catch(ActivityNotFoundException e){cb.onReceiveValue(null);return false;}}});
              webView.loadUrl("https://appassets.androidplatform.net/assets/site/"+BuildConfig.ENTRY_PATH);
            }
            private ValueCallback<Uri[]> fileCallback;
            private File outputDir(){return new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MUSIC),"Erom playlist");}
            private String safeName(String name){String n=name==null?"musica":name.replaceAll("[\\\\/:*?\"<>|]","_").trim();return n.isEmpty()?"musica":n;}
            private File uniqueFile(File dir,String name){File f=new File(dir,name);if(!f.exists())return f;int dot=name.lastIndexOf('.');String base=dot>0?name.substring(0,dot):name,ext=dot>0?name.substring(dot):"";int i=2;while(f.exists())f=new File(dir,base+" ("+i+++ ")"+ext);return f;}
            private boolean isAudio(String name){String n=name==null?"":name.toLowerCase(Locale.ROOT);for(String ext:AUDIO_EXT)if(n.endsWith(ext))return true;return false;}
            private void notifyFolder(String msg){String escaped=msg.replace("\\","\\\\").replace("'","\\'").replace("\n"," ");runOnUiThread(()->{if(webView!=null)webView.evaluateJavascript("if(window.eromFolderImportStatus)window.eromFolderImportStatus('"+escaped+"')",null);});}
            @Override protected void onActivityResult(int req,int res,Intent data){super.onActivityResult(req,res,data);if(req==701&&fileCallback!=null){fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res,data));fileCallback=null;return;}if(req==PICK_MUSIC_FOLDER){if(res!=RESULT_OK||data==null||data.getData()==null){notifyFolder("Importação cancelada.");return;}Uri tree=data.getData();try{getContentResolver().takePersistableUriPermission(tree,data.getFlags()&(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_GRANT_WRITE_URI_PERMISSION));DocumentFile root=DocumentFile.fromTreeUri(this,tree);if(root==null)throw new IOException("Não foi possível abrir a pasta selecionada");if(root.getName()!=null&&root.getName().toLowerCase(Locale.ROOT).contains("whatsapp")){notifyFolder("A pasta selecionada é do WhatsApp; importação bloqueada.");return;}File out=outputDir();if(!out.exists()&&!out.mkdirs())throw new IOException("Não foi possível criar Music/Erom playlist");int count=copyTree(root,out);notifyFolder("Concluído: "+count+" música(s) copiadas para Music/Erom playlist. Pastas relacionadas ao WhatsApp foram ignoradas.");}catch(Exception e){notifyFolder("Falha na importação: "+(e.getMessage()==null?"erro de leitura":e.getMessage()));}}}
            private int copyTree(DocumentFile dir,File out)throws IOException{int count=0;for(DocumentFile f:dir.listFiles()){String name=f.getName()==null?"":f.getName();if(f.isDirectory()){if(name.toLowerCase(Locale.ROOT).contains("whatsapp"))continue;count+=copyTree(f,out);}else if(f.isFile()&&isAudio(name)&&!name.toLowerCase(Locale.ROOT).contains("whatsapp")){File target=uniqueFile(out,safeName(name));try(InputStream in=getContentResolver().openInputStream(f.getUri());OutputStream stream=new FileOutputStream(target)){if(in==null)throw new IOException("Não foi possível ler "+name);byte[] buf=new byte[65536];int n;while((n=in.read(buf))!=-1)stream.write(buf,0,n);}catch(Exception e){target.delete();if(e instanceof IOException)throw (IOException)e;throw new IOException(e);}count++;}}return count;}
            @Override public void onWindowFocusChanged(boolean f){super.onWindowFocusChanged(f);if(f)immersiveMode();}
            @Override public void onBackPressed(){if(webView!=null&&webView.canGoBack())webView.goBack();else super.onBackPressed();}
          }
          EOF

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace -p android assembleDebug
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          mkdir -p output
          cp "$APK" output/Erom-Music-CSV-APK.apk
          sha256sum output/Erom-Music-CSV-APK.apk
          ls -lh output/Erom-Music-CSV-APK.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Erom-Music-CSV-APK
          path: output/Erom-Music-CSV-APK.apk
          if-no-files-found: error
          retention-days: 14
