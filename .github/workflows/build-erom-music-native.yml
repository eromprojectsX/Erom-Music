name: Build Erom Música Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - "erom-music-native/**"
      - ".github/workflows/build-erom-music-native.yml"

permissions:
  contents: read

concurrency:
  group: erom-music-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Erom Música nativo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validar estrutura do projeto
        shell: bash
        run: |
          set -euo pipefail
          test -s erom-music-native/settings.gradle
          test -s erom-music-native/build.gradle
          test -s erom-music-native/app/build.gradle
          test -s erom-music-native/app/src/main/AndroidManifest.xml
          test -s erom-music-native/app/src/main/java/br/com/erommusic/nativeapp/MainActivity.kt
          echo "Estrutura Gradle e fontes Android validadas."

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "::error::Android SDK/sdmanager não encontrado"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace -p erom-music-native clean :app:assembleDebug
          APK=erom-music-native/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "::error::APK nativo não foi gerado"; exit 1; }
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          mkdir -p output
          cp "$APK" output/Erom-Musica-NATIVO.apk
          sha256sum output/Erom-Musica-NATIVO.apk
          ls -lh output/Erom-Musica-NATIVO.apk

      - name: Disponibilizar APK nativo
        uses: actions/upload-artifact@v4
        with:
          name: Erom-Musica-NATIVO-APK
          path: output/Erom-Musica-NATIVO.apk
          if-no-files-found: error
          retention-days: 14
