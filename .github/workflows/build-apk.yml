name: Build EROM BOX APK

on:
  workflow_dispatch:
  push:
    paths:
      - "erom-box/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar EROM BOX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair pacote completo EROM BOX
        shell: bash
        run: |
          set -euo pipefail
          ZIP="erom-box/EROM-BOX-ATUALIZADO.zip"
          test -s "$ZIP" || { echo "::error::Pacote completo EROM BOX não encontrado"; exit 1; }
          mkdir -p source
          unzip -q "$ZIP" -d source
          ROOT="source/EROM-BOX-ATUALIZADO"
          test -s "$ROOT/android/app/src/main/java/br/com/erombox/app/MainActivity.java"
          test -s "$ROOT/android/app/build.gradle"
          test -s "$ROOT/public/index.html"
          # Incluir a interface e os recursos web dentro do pacote Android para uso local/offline.
          mkdir -p "$ROOT/android/app/src/main/assets/erombox"
          cp -R "$ROOT/public/." "$ROOT/android/app/src/main/assets/erombox/"
          echo "Arquivos da interface incluídos:"
          find "$ROOT/android/app/src/main/assets/erombox" -maxdepth 2 -type f | sort | head -100
          echo "ANDROID_ROOT=$ROOT/android" >> "$GITHUB_ENV"

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK/sdmanager não encontrado no runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace assembleDebug

      - name: Validar APK e tamanho
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$ANDROID_ROOT" -type f -path "*/build/outputs/apk/*/*.apk" -print -quit)
          test -n "$APK" || { echo "::error::Nenhum APK foi gerado"; exit 1; }
          mkdir -p output
          cp "$APK" output/EROM-BOX.apk
          ls -lh output/EROM-BOX.apk
          test "$(stat -c%s output/EROM-BOX.apk)" -gt 50000 || { echo "::error::APK pequeno demais; verifique se os recursos completos foram empacotados"; exit 1; }
          unzip -l output/EROM-BOX.apk | grep -q "assets/erombox/index.html" || { echo "::error::Interface EROM BOX não foi incluída no APK"; exit 1; }

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: EROM-BOX-APK
          path: output/EROM-BOX.apk
          if-no-files-found: error
          retention-days: 14
